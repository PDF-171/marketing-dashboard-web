<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Dashboard</title>

<style>
/* KEEP YOUR STYLE (shortened here for clarity) */
body {
  margin:0;
  font-family:Arial;
  background:#1d1d1d;
  color:white;
}

.category-bar { background:red; font-weight:bold; display:flex; }
.table-row { display:flex; }
.table-row.even { background:#848484; }
.table-row.odd { background:#4f4f4f; }

.col-number{width:3%}
.col-project,.col-sub,.col-head{width:10%}
.col-brand{width:10%;text-align:center}
.col-start,.col-deadline{width:10%;text-align:center}
.col-remarks{width:17%}
.col-accomplishment{width:10%}
.col-status{width:10%}

.brand-logo{height:40px}

.headline-box{
  height:40px;
  background:#e2cec3;
  overflow:hidden;
}

.headline-text{
  white-space:nowrap;
  display:inline-block;
  padding-left:100%;
  animation: scroll 30s linear infinite;
  color:black;
}

@keyframes scroll{
  from{transform:translateX(0)}
  to{transform:translateX(-100%)}
}
</style>
</head>

<body>

<h1 style="text-align:center;">MARKETING ONGOING PROJECTS</h1>

<div class="category-bar">
  <div class="col-number"></div>
  <div class="col-project">Project</div>
  <div class="col-sub">Sub</div>
  <div class="col-head">Head</div>
  <div class="col-brand">Brand</div>
  <div class="col-start">Start</div>
  <div class="col-deadline">Deadline</div>
  <div class="col-remarks">Remarks</div>
  <div class="col-accomplishment">%</div>
  <div class="col-status">Status</div>
</div>

<div id="data-rows"></div>

<div id="pageSpace" style="background:white;color:black;display:flex;"></div>

<div class="headline-box">
  <div id="headline-text" class="headline-text"></div>
</div>

<div id="time-text"></div>

<script>

const API = {
  headlines: "https://script.google.com/macros/s/AKfycbyiUmwPn3edhoWsnv8PT8Z5sZcEY6xBZtRhEKDtUYzKGqfpUFAlWSVW7hlqJTxup9NO/exec",
  projects: "https://script.google.com/macros/s/AKfycbxxaAX2ct3FWRAEuuo26IjzU8xnGxg722zgKc8qSAusRxVlahr2iqnPIew3Vmb_CNFZ/exec",
  fb: "https://script.google.com/macros/s/AKfycbw3bghTjbFKs4B3Dm6H7_DBMbFw3-o1yPnqRVQGkJv2a_vZ8nAeJAu1bxgEM4EhPqdMyA/exec",
  ig: "https://script.google.com/macros/s/AKfycbxdDKlonWwGZjMa79QLOjPqJuU4ivXuxisU4LBHzPjLc0Atw6nuVyX_CQNXSrrHkUP8TA/exec"
};

//////////////////////////////////////////////////
// HEADLINES
//////////////////////////////////////////////////
function loadHeadlines() {
  fetch(API.headlines)
    .then(res => res.json())
    .then(data => {
      const lines = Array.isArray(data) ? data : Object.values(data);
      const text = lines.join("   •   ");

      const el = document.getElementById("headline-text");
      el.textContent = text;

      startScrollLoop(el);
    });
}

function startScrollLoop(el) {
  function loop() {
    el.classList.add("scroll");

    setTimeout(() => {
      el.classList.remove("scroll");
      void el.offsetWidth;
      setTimeout(loop, 500);
    }, 30000);
  }
  loop();
}

//////////////////////////////////////////////////
// PROJECTS
//////////////////////////////////////////////////
let fullRows = [];
let rowPage = 0;

function loadTasks() {
  fetch(API.projects)
    .then(res => res.json())
    .then(data => {

      const rows = Array.isArray(data) ? data : Object.values(data);

      fullRows = rows.map((item, i) => {
        const brand = (item.brand || "").toLowerCase();

        return `
          <div class="table-row ${i % 2 === 0 ? 'even' : 'odd'}">
            <div class="col-number">${i + 1}</div>
            <div class="col-project">${item.project || ""}</div>
            <div class="col-sub">${item.sub || ""}</div>
            <div class="col-head">${item.head || ""}</div>
            <div class="col-brand">
              <img src="brands/${brand}.svg" class="brand-logo">
            </div>
            <div class="col-start">${item.start || ""}</div>
            <div class="col-deadline">${item.deadline || ""}</div>
            <div class="col-remarks">${item.remarks || ""}</div>
            <div class="col-accomplishment">${item.accomplishment || 0}%</div>
            <div class="col-status">${item.status || ""}</div>
          </div>
        `;
      });

      switchRows();
      setInterval(switchRows, 30000);
    });
}

function switchRows() {
  const container = document.getElementById("data-rows");

  if (!fullRows.length) return;

  container.innerHTML = fullRows.slice(rowPage * 10, (rowPage + 1) * 10).join('');
  rowPage = (rowPage + 1) % Math.ceil(fullRows.length / 10);
}

//////////////////////////////////////////////////
// PAGE SPACE (FB + IG)
//////////////////////////////////////////////////
let pages = [];
let pageIndex = 0;

function loadPageSpace() {

  Promise.all([
    fetch(API.fb).then(res => res.json()),
    fetch(API.ig).then(res => res.json())
  ])
  .then(([fbData, igData]) => {

    pages = Object.keys(fbData).map(brand => {

      const fb = Number(fbData[brand] || 0).toLocaleString();
      const ig = Number(igData[brand] || 0).toLocaleString();

      return `
        <div style="width:20%;text-align:center;color:black;">
          <img src="brands/${brand}_on_white.svg" style="max-height:50px;"><br>
          FB: ${fb}<br>
          IG: ${ig}
        </div>
      `;
    });

    updatePageSpace();
    setInterval(updatePageSpace, 10000);

  });
}

function updatePageSpace() {
  const container = document.getElementById("pageSpace");

  if (!pages.length) return;

  const batch = pages.slice(pageIndex, pageIndex + 5);
  container.innerHTML = batch.join('');

  pageIndex += 5;
  if (pageIndex >= pages.length) pageIndex = 0;
}

//////////////////////////////////////////////////
// TIME
//////////////////////////////////////////////////
function updateDateTime() {
  const now = new Date();

  document.getElementById('week-text').textContent =
    now.toLocaleDateString('en-US', { weekday: 'long' });

  document.getElementById('date-text').textContent =
    now.toLocaleDateString('en-US', { month: 'long', day: '2-digit' });

  document.getElementById('year-text').textContent =
    now.getFullYear();

  let hours = now.getHours();
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const seconds = String(now.getSeconds()).padStart(2, '0');
  const ampm = hours >= 12 ? 'PM' : 'AM';

  hours = hours % 12 || 12;

  document.getElementById('time-text').textContent =
    `${hours}:${minutes}:${seconds} ${ampm}`;
}

//////////////////////////////////////////////////
// INIT
//////////////////////////////////////////////////
loadHeadlines();
loadTasks();
loadPageSpace();

updateDateTime();
setInterval(updateDateTime, 1000);

</script>

</body>
</html>
