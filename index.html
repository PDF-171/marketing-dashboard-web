<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Marketing Dashboard</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background-color: #1d1d1d;
  color: white;
  height: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

header {
  min-height: 70px;
  padding: 10px;
  background: url('header.png') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(18px, 3vw, 48px);
  font-weight: bold;
  color: white;
  flex-shrink: 0;
}

.category-bar, .table-row {
  display: flex;
  align-items: center;
  padding: 0 0.5rem;
}

.table-row {
  display: flex;
  align-items: center;
  min-height: 6vh;
  flex-wrap: nowrap
}

.category-bar {
  display: flex;
  align-items: center;
  padding: 0 0.5rem;
  min-height: 7vh;
  height: auto;
  font-size: clamp(10px, 1.5vw, 18px);
  background-color: red;
  color: white;
  font-weight: bold;
}

.table-row.even { background-color: #848484; }
.table-row.odd { background-color: #4f4f4f; }

.table-row div:hover, .category-bar div:hover {
  padding: 0 0.5rem;
  overflow: visible;
  white-space: normal;
  text-overflow: unset;
}

.table-row div, .category-bar div {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.scroll {animation: tickerScroll 30s linear forwards;}

.col-number { width: 3%; }
.col-project, .col-sub, .col-head { width: 10%; }
.col-brand { width: 10%; text-align: center; }
.col-start, .col-deadline { width: 10%; text-align: center; }

.col-remarks {
  width: 17%;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: break-word;
  line-height: 1.4em;
  text-overflow: unset;
}

.col-accomplishment { width: 10%; }
.col-status { width: 10%; }

.progress-container {
  width: 80%;
  height: 40px;
  background-color: #333;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}

.progress-bar {
  height: 100%;
  width: 0%;
  border-radius: 6px;
  transition: width 0.5s ease;
}

.progress-segment {
  flex: 1;
  border-radius: 4px;
  opacity: 0.2;
  position: relative;
  overflow: hidden;
  transition: opacity 0.3s ease, background-color 0.3 ease;
}

.progress-segment::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 200%;
  height: 100%;
  background: repeating-linear-gradient(
    45deg,
    rgba(255,255,255,0.3) 0 10px,
    transparent 10px 20px
  );
  animation: flow 2s linear infinite;
}

@keyframes flow {
  100% {left: 0;}
}

.progress-container.full {
  box-shadow: 0 0 20px 5px #6ccf3c inset, 0 0 15px #6ccf3c;
}

.progress-segment.active { opacity: 1; }

.brand-logo {
  height: 5vh;
  max-width: 100%;
  object-fit: contain;
  display: block;
  margin: 0 auto;
}

.content {
  height: 63vh;
  overflow: hidden;
}

footer {
  height: 20vh;
  width: 100%;
  display: flex;
  flex-direction: column;
}

.footer-top {
  height: 12vh;
  background-color: white;
  width: 100%;
}

.footer-bottom {
  height: 8vh;
  background-color: #e2cec3;
  width: 100%;
}

.footer-logo {
  position: absolute;
  left: 0rem;
  top:80%;
  transform: translateY(0);
  height: 20vh;
  width: auto;
}

.name-time-box {
  position: absolute;
  z-index: 1;
  right:0rem;
  top:80%;
  height: 20vh;
  width: 20vh;
  background-color: red;
}

.week-box {
  position: absolute;
  bottom:15vh;
  right:0rem;
  width: 20vh;
  height: 5vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#week-text {
  font-size: 3vh;
  font-weight: bold;
  height: 4vh;
  width: auto;
  color: white
}

.date-box {
  position: absolute;
  bottom:10vh;
  right:0rem;
  width: 20vh;
  height: 5vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#date-text {
  font-size: 3vh;
  font-weight: 550;
  height: 3vh;
  width: auto;
  color: white
}

.year-box {
  position: absolute;
  bottom: 5vh;
  right:0rem;
  width: 20vh;
  height: 5vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#year-text {
  font-size: 3vh;
  font-weight: 600;
  height: 3vh;
  width: auto;
  color: white;
}

.time-box {
  position: absolute;
  bottom: 0vh;
  right: 0rem;
  width: 20vh;
  height: 5vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#time-text {
  font-size: 3vh;
  height: 4vh;
  width: auto;
  color: white;
  font-weight: 500;
}

.custom-box {
  position: absolute;
  top: 80vh;
  right: 12rem;
  width: 71.17%;
  height: 12vh;
  background-color: white;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: opacity 1s ease-in-out;
}

.white-ticker-item {
  width: 20%;
  display: flex;
  height: 100%;
  box-sizing: border-box;
  padding: 0 1vh
}

.white-ticker-item-left img {
  max-height: 100%;
  max-width: 100%;
  object-fit: contain;
  aspect-ratio: 1 / 1;
}

.white-ticker-item-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  margin-left: 1vh;
  text-align: center;
}

.ticker-brand-logo {
  max-width: 30%;
  max-height: 80%;
  min-height: 30%;
  object-fit: contain;
  vertical-align: middle;
  margin: 0 6px;
}

.headline-box {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 8vh;
  display: flex;
  align-items: center;
  overflow: hidden;
  white-space: nowrap;
  font-size: 2.5vh;
  font-weight: bold;
  z-index: 0;
}

.headline-text {
  display: inline-block;
  padding-left: 100%;
  color: black;
  white-space: nowrap;
}

.headline-text-wrapper {
  display: inline-block;
  padding-left: 100%;
  white-space: nowrap;
}

.scroll { animation: tickerScroll 30s linear forwards; }

@keyframes tickerScroll {
  0% { transform: translateX(0%); }
  100% { transform: translateX(-100%); }
}

.col-project {
  white-space: normal;
  overflow-wrap: break-word;
  word-wrap: break-word;
}

audio { display: none; }
</style>
</head>

<body>

<header>MARKETING ONGOING PROJECTS</header>

<div class="category-bar">
  <div class="col-number"></div>
  <div class="col-project">Project</div>
  <div class="col-sub">Sub Department</div>
  <div class="col-head">Project Head</div>
  <div class="col-brand">Brand</div>
  <div class="col-start">Date Started</div>
  <div class="col-deadline">Deadline</div>
  <div class="col-remarks">Remarks</div>
  <div class="col-accomplishment">Accomplishment</div>
  <div class="col-status">Status</div>
</div>

<div class="content" id="data-rows"></div>

<footer>
  <div class="footer-top">
    <div class="custom-box" id="pageSpace" style="display:flex;"></div>
  </div>

  <div class="footer-bottom">
    <div class="headline-box">
      <div class="headline-text" id="headline-text"></div>
    </div>
  </div>

  <div class="name-time-box">
    <div class="week-box"><div id="week-text"></div></div>
    <div class="date-box"><div id="date-text"></div></div>
    <div class="year-box"><div id="year-text"></div></div>
    <div class="time-box"><div id="time-text"></div></div>
  </div>

  <img src="logo.png" alt="Logo" class="footer-logo">
</footer>

<audio id="bg-music" src="startup.mp3" autoplay loop preload="auto"></audio>

  tasks: "https://script.google.com/macros/s/AKfycbxNcL22qE5qHIln8atmXEE0BZv5x9l5A7S5FKzM1sFAZslZZTabdG8n0GRZhpABVNYg/exec",
  fb: "https://script.google.com/macros/s/AKfycbzRJ9VcmN0GGeM4KTLNFTQT0GeJFGZkfxWqPmk0nKOXyjKoQpzvMI6Iv2y-0O157C1XIw/exec",

};

</body>
</html>
