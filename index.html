<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Marketing Dashboard</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background-color: #1d1d1d;
  color: white;
  height: 100%;
  overflow: hidden;
  display: flex; /* FIXED TYPO */
  flex-direction: column;
}

header {
  min-height: 70px;
  padding: 10px;
  background: url('header.png') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(18px, 3vw, 48px);
  font-weight: bold;
}

.category-bar, .table-row {
  display: flex;
  align-items: center;
  padding: 0 0.5rem;
}

.category-bar {
  min-height: 7vh;
  font-size: clamp(10px, 1.5vw, 18px);
  background-color: red;
  font-weight: bold;
}

.table-row {
  min-height: 6vh;
}

.table-row.even { background-color: #848484; }
.table-row.odd { background-color: #4f4f4f; }

.col-number { width: 3%; }
.col-project, .col-sub, .col-head { width: 10%; }
.col-brand { width: 10%; text-align: center; }
.col-start, .col-deadline { width: 10%; text-align: center; }
.col-remarks { width: 17%; }
.col-accomplishment { width: 10%; }
.col-status { width: 10%; }

.brand-logo {
  height: 5vh;
  object-fit: contain;
}

.content {
  height: 63vh;
  overflow: hidden;
}

footer {
  height: 20vh;
  position: relative;
}

.footer-top {
  height: 12vh;
  background: white;
}

.footer-bottom {
  height: 8vh;
  background: #e2cec3;
}

.name-time-box {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 20vh;
  background: red;
}

.headline-box {
  height: 100%;
  display: flex;
  align-items: center;
  overflow: hidden;
}

.headline-text {
  white-space: nowrap;
  animation: tickerScroll 30s linear infinite;
}

@keyframes tickerScroll {
  from { transform: translateX(100%); }
  to { transform: translateX(-100%); }
}
</style>
</head>

<body>

<header>MARKETING ONGOING PROJECTS</header>

<div class="category-bar">
  <div class="col-number"></div>
  <div class="col-project">Project</div>
  <div class="col-sub">Sub Department</div>
  <div class="col-head">Project Head</div>
  <div class="col-brand">Brand</div>
  <div class="col-start">Date Started</div>
  <div class="col-deadline">Deadline</div>
  <div class="col-remarks">Remarks</div>
  <div class="col-accomplishment">Accomplishment</div>
  <div class="col-status">Status</div>
</div>

<div class="content" id="data-rows"></div>

<footer>
  <div class="footer-top"></div>

  <div class="footer-bottom">
    <div class="headline-box">
      <div class="headline-text" id="headline-text">Loading headlines...</div>
    </div>
  </div>

  <div class="name-time-box">
    <div id="time-text"></div>
  </div>
</footer>

<script>
const API = {
  headlines: "https://script.google.com/macros/s/AKfycbyiUmwPn3edhoWsnv8PT8Z5sZcEY6xBZtRhEKDtUYzKGqfpUFAlWSVW7hlqJTxup9NO/exec",
  tasks: "https://script.google.com/macros/s/AKfycbxNcL22qE5qHIln8atmXEE0BZv5x9l5A7S5FKzM1sFAZslZZTabdG8n0GRZhpABVNYg/exec"
};

/* HEADLINES */
function loadHeadlines() {
  fetch(API.headlines)
    .then(res => res.json())
    .then(data => {
      const text = data.join(" • ");
      document.getElementById("headline-text").textContent = text;
    });
}

/* TASKS */
function loadTasks() {
  fetch(API.tasks)
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById("data-rows");

      container.innerHTML = data.map((item, i) => `
        <div class="table-row ${i % 2 === 0 ? 'even' : 'odd'}">
          <div class="col-number">${i + 1}</div>
          <div class="col-project">${item.project || ''}</div>
          <div class="col-sub">${item.sub || ''}</div>
          <div class="col-head">${item.head || ''}</div>
          <div class="col-brand">
            <img src="brands/${(item.brand || '').toLowerCase()}.svg" class="brand-logo">
          </div>
          <div class="col-start">${item.start || ''}</div>
          <div class="col-deadline">${item.deadline || ''}</div>
          <div class="col-remarks">${item.remarks || ''}</div>
          <div class="col-accomplishment">${item.accomplishment || 0}%</div>
          <div class="col-status">${item.status || ''}</div>
        </div>
      `).join('');
    });
}

/* TIME */
function updateTime() {
  const now = new Date();
  document.getElementById("time-text").textContent = now.toLocaleTimeString();
}

setInterval(updateTime, 1000);

/* INIT */
loadHeadlines();
loadTasks();
updateTime();
</script>

</body>
</html>
