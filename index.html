<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marketing Dashboard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #1d1d1d;
      color: white;
      height: 100%;
      overflow: hidden;
    }

    header {
      height: 10vh;
      background: url('header.png') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9vh;
      font-weight: bold;
      color: white;
    }

    .category-bar, .table-row {
      display: flex;
      align-items: center;
      padding: 0 0.5rem;
    }

    .category-bar {
      height: 7vh;
    }

    .table-row {
      height: 6.3vh;
    }

    .category-bar {
      background-color: red;
      font-weight: bold;
    }

    .table-row.even { background-color: #848484; }
    .table-row.odd { background-color: #4f4f4f; }


    .table-row div hover, .category-bar div hover {
      padding: 0 0.5rem;
      overflow: visible;
      white-space: normal;
      text-overflow: unset;
    }

    .scroll {animation: tickerScroll 30s linear forwards;}
    
    .col-number { width: 3%; }
    .col-project, .col-sub, .col-head { width: 10%; }
    .col-brand { width: 10%; text-align: center; }
    .col-start, .col-deadline { width: 10%; text-align: center; }

    .col-remarks {
      width: 17%;
      white-space: normal;
      overflow-wrap: break-word;
      word-break: break-word;
      line-height: 1.4em;
      text-overflow: unset;
    }

    .col-accomplishment { width: 10%; }
    .col-status { width: 10%; }

    .progress-container {
      width: 80%;
      height: 40px;
      background-color: #333;
      border-radius: 6px;
      display: flex;
      gap: 4px;
      padding: 4px;
      box-sizing: border-box;
    }


    .progress-segment {
      flex: 1;
      border-radius: 4px;
      opacity: 0.2;
      position: relative;
      overflow: hidden;
      transition: opacity 0.3s ease, background-color 0.3 ease;
    }

    .progress-segment::before {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 200%;
      height: 100%;
      background: repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.3) 0 10px,
        transparent 10px 20px
      );
      animation: flow 2s linear infinite;
    }

    @keyframes flow {
      100% {left: 0;}
    }

    .progress-container.full {
      box-shadow: 0 0 20px 5px #6ccf3c inset, 0 0 15px #6ccf3c;
    }

    .progress-segment.active {
      opacity: 1;
    }


    .brand-logo {
      height: 5vh;
      max-width: 100%;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .content {
      height: 63vh;
      overflow: hidden;
    }

    footer {
      height: 20vh;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .footer-top {
      height: 12vh;
      background-color: white;
      width: 100%;
    }

    .footer-bottom {
      height: 8vh;
      background-color: #e2cec3;
      width: 100%;
    }

    .footer-logo {
      position: absolute;
      left: 0rem;
      top:80%;
      transform: translateY(0);
      height: 20vh;
      width: auto;
    }

    .name-time-box {
      position: absolute;
      z-index: 1;
      right:0rem;
      top:80%;
      height: 20vh;
      width: 20vh;
      background-color: red;
    }

    .week-box {
      position: absolute;
      bottom:15vh;
      right:0rem;
      width: 20vh;
      height: 5vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #week-text {
      font-size: 3vh;
      font-weight: bold;
      height: 4vh;
      width: auto;
      color: white
    }

    .date-box {
      position: absolute;
      bottom:10vh;
      right:0rem;
      width: 20vh;  
      height: 5vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #date-text {
      font-size: 3vh;
      font-weight: 550;
      height: 3vh;
      width: auto;
      color: white
    }

    .year-box {
      position: absolute;
      bottom: 5vh;
      right:0rem;
      width: 20vh;
      height: 5vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #year-text {
      font-size: 3vh;
      font-weight: 600;
      height: 3vh;
      width: auto;
      color: white;
    }

    .time-box {
      position: absolute;
      bottom: 0vh;
      right: 0rem;
      width: 20vh;
      height: 5vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #time-text {
      font-size: 3vh;
      height: 4vh;
      width: auto;
      color: white;
      font-weight: 500;
    }

    .custom-box {
      position: absolute;
      top: 80vh;
      right: 12rem;
      width: 71.17%;
      height: 12vh;
      background-color: white;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 1s ease-in-out;
    }

    .white-ticker-item {
      width: 20%;
      display: flex;
      height: 100%;
      box-sizing: border-box;
      padding: 0 1vh
    }

    .white-ticker-item-left img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      aspect-ratio: 1 / 1;
    }

    .white-ticker-item-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-left: 1vh; /* adds space from the logo */
      text-align: center;
    }

    .ticker-brand-logo {
      max-width: 30%;
      max-height: 80%;
      min-height: 30%;
      object-fit: contain;
      vertical-align: middle;
      margin: 0 6px;
    }

    .headline-box {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 8vh;
        display: flex;
        align-items: center;
        overflow: hidden;
        white-space: nowrap;
        font-size: 2.5vh;
        font-weight: bold;
        z-index: 0;
      }

      .headline-text {
        display: inline-block;
        padding-left: 100%;
        color: black;
        white-space: nowrap;
      }

      .headline-text-wrapper {
      display: inline-block;
      padding-left: 100%;
      white-space: nowrap;
    }

    .scroll {
      animation: tickerScroll 30s linear forwards;
    }

    @keyframes tickerScroll {
      0%   { transform: translateX(0%); }
      100% { transform: translateX(-100%); }
    }

    .col-project {
      white-space: normal;
      overflow-wrap: break-word;
      word-wrap: break-word;  
    }


    audio { display: none; }
  </style>
</head>
<body>
  <header>MARKETING ONGOING PROJECTS</header>

  <div class="category-bar">
    <div class="col-number"></div>
    <div class="col-project">Project</div>
    <div class="col-sub">Sub Department</div>
    <div class="col-head">Project Head</div>
    <div class="col-brand">Brand</div>
    <div class="col-start">Date Started</div>
    <div class="col-deadline">Deadline</div>
    <div class="col-remarks">Remarks</div>
    <div class="col-accomplishment">Accomplishment</div>
    <div class="col-status">Status</div>
  </div>

  <div class="content" id="data-rows"></div>

  <footer>
    <div class="footer-top">
      <div class="custom-box" id="pageSpace" style="display:flex;"></div>
    </div>

    <div class="footer-bottom">
      <div class="headline-box">
        <div class="headline-text" id="headline-text"></div>
      </div>
    </div> 

    <div class="name-time-box">
      <div class="week-box">
        <div id="week-text"></div>
      </div>
      <div class="date-box">
        <div id="date-text"></div>
      </div>
      <div class="year-box">
        <div id="year-text"></div>
      </div>
      <div class="time-box">
        <div id="time-text"></div>
      </div>
    </div>

    <img src="logo.png" alt="Logo" class="footer-logo">
  </footer>

  <audio id="bg-music" src="startup.mp3" autoplay loop preload="auto"></audio>

<script>

/* ================================
   API (REPLACES CSV)
================================= */
const API = {
  headlines: "https://script.google.com/macros/s/AKfycbyiUmwPn3edhoWsnv8PT8Z5sZcEY6xBZtRhEKDtUYzKGqfpUFAlWSVW7hlqJTxup9NO/exec",
  tasks: "https://script.google.com/macros/s/AKfycbxxaAX2ct3FWRAEuuo26IjzU8xnGxg722zgKc8qSAusRxVlahr2iqnPIew3Vmb_CNFZ/exec",
  fb: "https://script.google.com/macros/s/AKfycbzRJ9VcmN0GGeM4KTLNFTQT0GeJFGZkfxWqPmk0nKOXyjKoQpzvMI6Iv2y-0O157C1XIw/exec",
  ig: "https://script.google.com/macros/s/AKfycbx3BRz2BkYde81Le3iQ_-ni6yj-_dKP_t8y3v7XvXsNOo-ASbSXZjnwg4plYm_PGihhkw/exec"
};

/* ================================
   HEADLINES (FROM GSHEET)
================================= */
function loadHeadlines() {
  fetch(API.headlines)
    .then(res => res.json())
    .then(data => {
      const lines = Array.isArray(data) ? data : Object.values(data);
      const text = lines.join('   •   ');
      const el = document.getElementById('headline-text');
      el.textContent = text;
      startScrollLoop(el);
    });
}

function startScrollLoop(element) {
  function scrollCycle() {
    element.classList.add('scroll');

    setTimeout(() => {
      element.classList.remove('scroll');

      // force reflow to restart animation
      void element.offsetWidth;

      setTimeout(() => {
        scrollCycle();
      }, 500);

    }, 30000);
  }

  scrollCycle();
}

/* ================================
   PROJECTS (FROM GSHEET)
================================= */
let fullRows = [], rowPage = 0;

function loadTasks() {
  fetch(API.tasks)
    .then(res => res.json())
    .then(data => {

      const rows = Array.isArray(data) ? data : Object.values(data);

      fullRows = rows.map((item, i) => {

        const brand = (item.brand || "").toLowerCase();
        const accomplishment = item.accomplishment || 0;

        return `
          <div class="table-row ${i % 2 === 0 ? 'even' : 'odd'}">
            <div class="col-number">${i + 1}</div>
            <div class="col-project">${item.project || ''}</div>
            <div class="col-sub">${item.sub || ''}</div>
            <div class="col-head">${item.head || ''}</div>

            <div class="col-brand">
              <img src="brands/${brand}.svg" class="brand-logo">
            </div>

            <div class="col-start">${item.start || ''}</div>
            <div class="col-deadline">${item.deadline || ''}</div>
            <div class="col-remarks">${item.remarks || ''}</div>

            <div class="col-accomplishment">
              <div>${accomplishment}%</div>
              <div class="progress-container">
                <div class="progress-segment"></div>
                <div class="progress-segment"></div>
                <div class="progress-segment"></div>
                <div class="progress-segment"></div>
              </div>
            </div>

            <div class="col-status">${item.status || ''}</div>
          </div>
        `;
      });

      switchRows();
      setInterval(switchRows, 30000);
    });
}

/* ================================
   FB + IG MERGED DISPLAY
================================= */
let pages = [];
let pageBatchIndex = 0;

function loadPageSpace() {

  Promise.all([
    fetch(API.fb).then(res => res.json()),
    fetch(API.ig).then(res => res.json())
  ])
  .then(([fbData, igData]) => {

    const brands = Object.keys(fbData);

    pages = brands.map(brand => {

      const fbVal = fbData[brand] || { value: 0, difference: 0 };
      const igVal = igData[brand] || { value: 0, difference: 0 };

      function getIndicator(diff){
        if(diff > 0) return '<span style="color:green;">▲</span>';
        if(diff < 0) return '<span style="color:red;">▼</span>';
        return '<span style="display:inline-block;width:12px;height:8px;background:black;border-radius:2px;"></span>';
      }

      return `
        <div class="white-ticker-item">
          <div class="white-ticker-item-left">
            <img src="brands/${brand.toLowerCase()}_on_white.svg" class="ticker-brand-logo">
          </div>
          <div class="white-ticker-item-right">
            <div style="color:black;font-weight:bold;">
              FB: ${fbVal.value} ${getIndicator(fbVal.difference)}
            </div>
            <div style="color:black;font-weight:bold;">
              IG: ${igVal.value} ${getIndicator(igVal.difference)}  
            </div>
          </div>
        </div>
      `;
    });

    updatePageSpace();
    setInterval(updatePageSpace, 10000);
  });
}

/* ================================
   KEEP YOUR EXISTING FUNCTIONS
================================= */
function switchRows() {
  const container = document.getElementById('data-rows');
  container.innerHTML = fullRows.slice(rowPage * 10, (rowPage + 1) * 10).join('');
  rowPage = (rowPage + 1) % Math.ceil(fullRows.length / 10);
}

function updatePageSpace() {
  const pageSpace = document.getElementById('pageSpace');
  const batch = pages.slice(pageBatchIndex, pageBatchIndex + 5);

  pageSpace.style.justifyContent = batch.length < 5 ? 'center' : 'space-between';
  pageSpace.style.opacity = 0;

  setTimeout(() => {
    pageSpace.innerHTML = batch.join('');
    pageSpace.style.opacity = 1;

    pageBatchIndex += 5;
    if (pageBatchIndex >= pages.length) pageBatchIndex = 0;
  }, 1000);
}

/* ================================
   INIT (UNCHANGED)
================================= */
loadHeadlines();
loadTasks();
loadPageSpace();

/* ================================
   DATE & TIME
================================= */
function updateDateTime() {
  const now = new Date();

  const weekDays = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  const day = weekDays[now.getDay()];
  const date = now.getDate();
  const month = months[now.getMonth()];
  const year = now.getFullYear();

  let hours = now.getHours();
  let minutes = now.getMinutes();
  let seconds = now.getSeconds();

  // format time (12-hour format)
  const ampm = hours >= 12 ? "PM" : "AM";
  hours = hours % 12 || 12;

  minutes = minutes.toString().padStart(2, '0');
  seconds = seconds.toString().padStart(2, '0');

  const timeString = `${hours}:${minutes}:${seconds} ${ampm}`;

  document.getElementById("week-text").textContent = day;
  document.getElementById("date-text").textContent = `${month} ${date}`;
  document.getElementById("year-text").textContent = year;
  document.getElementById("time-text").textContent = timeString;
}

// run immediately + every second
updateDateTime();
setInterval(updateDateTime, 1000);

</script>
</body>
</html>
