<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marketing Dashboard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #1d1d1d;
      color: white;
    }

    header {
      min-height: 70px;
      flex: 0 0 70px;
      padding: 10px;
      background: url('header.png') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(18px, 3vw, 48px);
      font-weight: bold;
      color: white;
      flex-shrink: 0;
    }

    .category-bar, .table-row {
      display: flex;
      align-items: center;
      padding: 0 0.5rem;
    }

    .table-row {
      display: flex;
      align-items: center;
      min-height: 6vh;
      flex-wrap: nowrap
    }

    .category-bar {
      display: flex;
      align-items: center;
      padding: 0 0.5rem;
      min-height: 7vh;
      height: auto;
      font-size: clamp(10px, 1.5vw, 18px);
      background-color: red;
      color: white; 
      font-weight: bold;
    }

    .table-row.even { background-color: #848484; }
    .table-row.odd { background-color: #4f4f4f; }


    .table-row div:hover, 
    .category-bar div:hover {
      padding: 0 0.5rem;
      overflow: visible;
      white-space: normal;
      text-overflow: unset;
    }

    .table-row div,
    .category-bar div {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .scroll {animation: tickerScroll 30s linear forwards;}
    
    .col-number { width: 3%; }
    .col-project, .col-sub, .col-head { width: 10%; }
    .col-brand { width: 10%; text-align: center; }
    .col-start, .col-deadline { width: 10%; text-align: center; }

    .col-remarks {
      width: 17%;
      white-space: normal;
      overflow-wrap: break-word;
      word-break: break-word;
      line-height: 1.4em;
      text-overflow: unset;
    }

    .col-accomplishment { width: 10%; }
    .col-status { width: 10%; }

    .progress-container {
      width: 80%;
      height: 40px;
      background-color: #333;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
  height: 100%;
  width: 0%;
  border-radius: 6px;
  transition: width 0.5s ease;
  }


    .progress-segment {
      flex: 1;
      border-radius: 4px;
      opacity: 0.2;
      position: relative;
      overflow: hidden;
      transition: opacity 0.3s ease, background-color 0.3 ease;
    }

    .progress-segment::before {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 200%;
      height: 100%;
      background: repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.3) 0 10px,
        transparent 10px 20px
      );
      animation: flow 2s linear infinite;
    }

    @keyframes flow {
      100% {left: 0;}
    }

    .progress-container.full {
      box-shadow: 0 0 20px 5px #6ccf3c inset, 0 0 15px #6ccf3c;
    }

    .progress-segment.active {
      opacity: 1;
    }


    .brand-logo {
      height: 5vh;
      max-width: 100%;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .content {
      flex: 1;
      overflow: hidden;
    }

    footer {
      height: 20vh;
      display: flex;
      flex-direction: row;
      width: 100%;
      border-top: 2px solid #333;
    }

    .footer-left {
      width: 20vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background: none;
      box-shadow: none;
    }

    .footer-logo-fixed {
      max-height: 10vh;
      width: auto;
      display: block;
    }

    .footer-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .footer-main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .footer-top {
      flex: 1;
      background: white;
    }

    .footer-bottom {
      flex: 1;
      background-color: #e2cec3;
    }

    .footer-side {
      width: 220px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 0.5vh;
    }

    .footer-logo {
      width: 100%;
      max-height: 8vh;
      object-fit: contain;
    }

    .name-time-box {
      z-index: 1;
      right:0rem;
      top:80%;
      height: 20vh;
      width: 20vh;
      background-color: red;
    }

    .week-box {
      bottom:15vh;
      right:0rem;
      width: 20vh;
      height: 5vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #week-text {
      font-size: 3vh;
      font-weight: bold;
      height: 4vh;
      width: auto;
      color: white
    }

    .date-box {
      bottom:10vh;
      right:0rem;
      width: 20vh;  
      height: 5vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #date-text {
      font-size: 3vh;
      font-weight: 550;
      height: 3vh;
      width: auto;
      color: white
    }

    .year-box {
      bottom: 5vh;
      right:0rem;
      width: 20vh;
      height: 5vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #year-text {
      font-size: 3vh;
      font-weight: 600;
      height: 3vh;
      width: auto;
      color: white;
    }

    .time-wrapper {
      text-align: center;
      color: white;
      font-size: 2vh;
      line-height: 1.3;
    }

    .time-box {
      bottom: 0vh;
      right: 0rem;
      width: 20vh;
      height: 5vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #time-text {
      font-size: 3vh;
      height: 4vh;
      width: auto;
      color: white;
      font-weight: 500;
    }

    .custom-box {
      height: 12vh;
      background-color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease-in-out;
      overflow: hidden;
    }

    .white-ticker-item {
      width: 20%;
      display: flex;
      height: 100%;
      box-sizing: border-box;
      padding: 0 1vh
    }

    .white-ticker-item-left img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      aspect-ratio: 1 / 1;
    }

    .white-ticker-item-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-left: 1vh; /* adds space from the logo */
      text-align: center;
    }

    .ticker-brand-logo {
      max-width: 30%;
      max-height: 80%;
      min-height: 30%;
      object-fit: contain;
      vertical-align: middle;
      margin: 0 6px;
    }

    .headline-box {
      bottom: 0;
      height: 8vh;
      width: 100%;
      background-color: #e2cec3;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .footer-right{
      width: 20vh;
      background-color: red;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }

      .headline-text {
        display: inline-block;
        padding-left: 100%;
        color: black;
        font-size: 2.5vh;
        font-weight: bold;
      }

      .headline-text-wrapper {
      display: inline-block;
      padding-left: 100%;
      white-space: nowrap;
    }

    .scroll {
      animation: tickerScroll 30s linear forwards;
    }

    @keyframes tickerScroll {
      0%   { transform: translateX(0%); }
      100% { transform: translateX(-100%); }
    }

    .col-project {
      white-space: normal;
      overflow-wrap: break-word;
      word-wrap: break-word;  
    }


    audio { display: none; }
  </style>
</head>
<body>
  <header>MARKETING ONGOING PROJECTS</header>

  <div class="category-bar">
    <div class="col-number"></div>
    <div class="col-project">Project</div>
    <div class="col-sub">Sub Department</div>
    <div class="col-head">Project Head</div>
    <div class="col-brand">Brand</div>
    <div class="col-start">Date Started</div>
    <div class="col-deadline">Deadline</div>
    <div class="col-remarks">Remarks</div>
    <div class="col-accomplishment">Accomplishment</div>
    <div class="col-status">Status</div>
  </div>

  <div class="content" id="data-rows"></div>

  <footer>
    <div class="footer-left">
      <img src="logo.png" class="footer-logo-fixed">
    </div>

    <div class="footer-center">
      <div class="custom-box" id="pageSpace"></div>
      <div class="headline-box">
        <div class="headline-text" id="headline-text"></div>
      </div>
    </div>

    <div class="footer-right">
        <div class="time-wrapper">
          <div id="week-text"></div>
          <div id="date-text"></div>
          <div id="year-text"></div>
          <div id="time-text"></div>
        </div>
    </div>
  </footer>

  <audio id="bg-music" src="startup.mp3" autoplay loop preload="auto"></audio>

<script>

/* ================================
   API (REPLACES CSV)
================================= */
const API = {
  headlines: "https://script.google.com/macros/s/AKfycbyiUmwPn3edhoWsnv8PT8Z5sZcEY6xBZtRhEKDtUYzKGqfpUFAlWSVW7hlqJTxup9NO/exec",
  tasks: "https://script.google.com/macros/s/AKfycbxNcL22qE5qHIln8atmXEE0BZv5x9l5A7S5FKzM1sFAZslZZTabdG8n0GRZhpABVNYg/exec",
  fb: "https://script.google.com/macros/s/AKfycbzRJ9VcmN0GGeM4KTLNFTQT0GeJFGZkfxWqPmk0nKOXyjKoQpzvMI6Iv2y-0O157C1XIw/exec",
  ig: "https://script.google.com/macros/s/AKfycbx3BRz2BkYde81Le3iQ_-ni6yj-_dKP_t8y3v7XvXsNOo-ASbSXZjnwg4plYm_PGihhkw/exec"
};

/* ================================
   HEADLINES (FROM GSHEET)
================================= */
function loadHeadlines() {
  fetch(API.headlines)
    .then(res => res.json())
    .then(data => {
      const lines = Array.isArray(data) ? data : Object.values(data);
      const text = lines.join('   •   ');
      const el = document.getElementById('headline-text');
      el.textContent = text;
      startScrollLoop(el);
    });
}

function startScrollLoop(element) {
  function scrollCycle() {
    element.classList.add('scroll');

    setTimeout(() => {
      element.classList.remove('scroll');

      // force reflow to restart animation
      void element.offsetWidth;

      setTimeout(() => {
        scrollCycle();
      }, 500);

    }, 30000);
  }

  scrollCycle();
}

/* ================================
   PROJECTS (FROM GSHEET)
================================= */
let fullRows = [], rowPage = 0;

function switchRows() {
  const container = document.getElementById('data-rows');

  const start = rowPage * 10;
  const pageRows = fullRows.slice(start, start + 10);
  while (pageRows.length < 10) {
  pageRows.push(null)
  }

container.innerHTML = pageRows.map((item, i) => {

  const globalIndex = start + i;

  // EMPTY ROW HANDLER
  if (!item) {
    return `
      <div class="table-row ${globalIndex % 2 === 0 ? 'even' : 'odd'}">
        <div class="col-number"></div>
        <div class="col-project"></div>
        <div class="col-sub"></div>
        <div class="col-head"></div>
        <div class="col-brand"></div>
        <div class="col-start"></div>
        <div class="col-deadline"></div>
        <div class="col-remarks"></div>
        <div class="col-accomplishment"></div>
        <div class="col-status"></div>
      </div>
    `;
  }

  const brand = (item.brand || "").toLowerCase();
  const accomplishment = item.accomplishment || 0;
  const color = getProgressColor(accomplishment);

  return `
    <div class="table-row ${globalIndex % 2 === 0 ? 'even' : 'odd'}">
      <div class="col-number">${globalIndex + 1}</div>
      <div class="col-project">${item.project || ''}</div>
      <div class="col-sub">${item.sub || ''}</div>
      <div class="col-head">${item.head || ''}</div>

      <div class="col-brand">
        <img src="brands/${brand}.svg" class="brand-logo">
      </div>

      <div class="col-start">${formatDate(item.start)}</div>
<div class="col-deadline">${formatDate(item.deadline)}</div>
      <div class="col-remarks">${item.remarks || ''}</div>

      <div class="col-accomplishment">
        <div>${accomplishment}%</div>
        <div class="progress-container">
          <div class="progress-bar"
            style="width:${accomplishment}%; background:${color}">
          </div>
        </div>
      </div>

      <div class="col-status">${item.status || ''}</div>
    </div>
  `;
}).join('');

  rowPage = (rowPage + 1) % Math.ceil(fullRows.length / 10);
}

/* ================================
   FB + IG MERGED DISPLAY
================================= */
let pages = [];
let pageBatchIndex = 0;

function loadPageSpace() {

  Promise.all([
    fetch(API.fb).then(res => res.json()),
    fetch(API.ig).then(res => res.json())
  ])
  .then(([fbData, igData]) => {

    const brands = Object.keys(fbData);

    pages = brands.map(brand => {

      const fbVal = fbData[brand] || { value: 0, difference: 0 };
      const igVal = igData[brand] || { value: 0, difference: 0 };

      function getIndicator(diff){
        if(diff > 0) return '<span style="color:green;">▲</span>';
        if(diff < 0) return '<span style="color:red;">▼</span>';
        return '<span style="display:inline-block;width:12px;height:8px;background:black;border-radius:2px;"></span>';
      }

      return `
        <div class="white-ticker-item">
          <div class="white-ticker-item-left">
            <img src="brands/${brand.toLowerCase()}_on_white.svg" class="ticker-brand-logo">
          </div>
          <div class="white-ticker-item-right">
            <div style="color:black;font-weight:bold;">
              FB: ${fbVal.value} ${getIndicator(fbVal.difference)}
            </div>
            <div style="color:black;font-weight:bold;">
              IG: ${igVal.value} ${getIndicator(igVal.difference)}  
            </div>
          </div>
        </div>
      `;
    });

    updatePageSpace();
    setInterval(updatePageSpace, 10000);
    setInterval(loadHeadlines, 30000);
    setInterval(loadTasks, 5000);
    setInterval(loadPageSpace, 10000);
  });
}


function updatePageSpace() {
  const pageSpace = document.getElementById('pageSpace');
  const batch = pages.slice(pageBatchIndex, pageBatchIndex + 5);

  pageSpace.style.justifyContent = batch.length < 5 ? 'center' : 'space-between';
  pageSpace.style.opacity = 0;

  setTimeout(() => {
    pageSpace.innerHTML = batch.join('');
    pageSpace.style.opacity = 1;

    pageBatchIndex += 5;
    if (pageBatchIndex >= pages.length) pageBatchIndex = 0;
  }, 1000);
}

/* ================================
   INIT (UNCHANGED)
================================= */
loadHeadlines();
loadTasks();
loadPageSpace();

function loadTasks() {
  fetch(API.tasks)
    .then(res => res.json())
    .then(data => {
      fullRows = Array.isArray(data) ? data : Object.values(data);

      rowPage = 0;
      switchRows(); // FIRST RENDER

      setInterval(switchRows, 5000); // AUTO ROTATE PAGES
    });
}

/* ================================
   DATE & TIME
================================= */
function updateDateTime() {
  const now = new Date();

  const weekDays = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  const day = weekDays[now.getDay()];
  const date = now.getDate();
  const month = months[now.getMonth()];
  const year = now.getFullYear();

  let hours = now.getHours();
  let minutes = now.getMinutes();
  let seconds = now.getSeconds();

  // format time (12-hour format)
  const ampm = hours >= 12 ? "PM" : "AM";
  hours = hours % 12 || 12;

  minutes = minutes.toString().padStart(2, '0');
  seconds = seconds.toString().padStart(2, '0');

  const timeString = `${hours}:${minutes}:${seconds} ${ampm}`;

  document.getElementById("week-text").textContent = day;
  document.getElementById("date-text").textContent = `${month} ${date}`;
  document.getElementById("year-text").textContent = year;
  document.getElementById("time-text").textContent = timeString;
}

// run immediately + every second
updateDateTime();
setInterval(updateDateTime, 1000);

function getProgressColor(percent) {
  percent = Math.max(0, Math.min(100, percent));

  // 0–1: red
  if (percent <= 1) return "rgb(255,0,0)";

  // 2–49: stepped red → yellow
  if (percent < 50) {
    const t = (percent - 2) / (49 - 2);
    const g = Math.round(255 * t);

    // add slight stepping effect
    const step = Math.round(t * 20) / 20;
    return `rgb(255, ${Math.round(255 * step)}, 0)`;
  }

  // 50: yellow
  if (percent === 50) return "rgb(255,255,0)";

  // 51–99: yellow → green (stepped)
  if (percent < 100) {
    const t = (percent - 51) / (99 - 51);

    const step = Math.round(t * 20) / 20;
    const r = Math.round(255 * (1 - step));

    return `rgb(${r},255,0)`;
  }

  // 100: green
  return "rgb(0,200,0)";
}

  function formatDate(dateStr) {
  if (!dateStr) return "";

  const date = new Date(dateStr);

  if (isNaN(date)) return dateStr; // fallback if already formatted

  const months = [
    "January","February","March","April","May","June",
    "July","August","September","October","November","December"
  ];

  const month = months[date.getMonth()];
  const day = String(date.getDate()).padStart(2, "0");
  const year = date.getFullYear();

  return `${month} ${day}, ${year}`;
}

</script>
</body>
</html>
