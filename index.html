<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marketing Dashboard</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #1d1d1d;
      color: white;
      height: 100%;
      overflow: hidden;
    }

    header {
      height: 10vh;
      background: url('header.png') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9vh;
      font-weight: bold;
      color: white;
    }

    .category-bar,
    .table-row {
      display: flex;
      align-items: center;
      padding: 0 0.5rem;
    }

    .category-bar {
      height: 7vh;
      background-color: red;
      font-weight: bold;
    }

    .table-row {
      height: 6.3vh;
    }

    .table-row.even {
      background-color: #848484;
    }

    .table-row.odd {
      background-color: #4f4f4f;
    }

    .col-number { width: 3%; }
    .col-project, .col-sub, .col-head { width: 10%; }
    .col-brand { width: 10%; text-align: center; }
    .col-start, .col-deadline { width: 10%; text-align: center; }

    .col-remarks {
      width: 17%;
      white-space: normal;
      overflow-wrap: break-word;
      word-break: break-word;
      line-height: 1.4em;
    }

    .col-accomplishment { width: 10%; }
    .col-status { width: 10%; }

    .content {
      height: 63vh;
      overflow: hidden;
    }

    footer {
      height: 20vh;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .footer-top {
      height: 12vh;
      background-color: white;
    }

    .footer-bottom {
      height: 8vh;
      background-color: #e2cec3;
    }

    .footer-logo {
      position: absolute;
      left: 0rem;
      top: 80%;
      height: 20vh;
    }

    .name-time-box {
      position: absolute;
      right: 0rem;
      top: 80%;
      height: 20vh;
      width: 20vh;
      background-color: red;
    }

    .headline-box {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 8vh;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      font-size: 2.5vh;
      font-weight: bold;
    }

    .headline-text {
      display: inline-block;
      padding-left: 100%;
      color: black;
      white-space: nowrap;
    }

    .scroll {
      animation: tickerScroll 30s linear forwards;
    }

    @keyframes tickerScroll {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-100%); }
    }

  </style>
</head>

<body>

  <header>MARKETING ONGOING PROJECTS</header>

  <div class="category-bar">
    <div class="col-number"></div>
    <div class="col-project">Project</div>
    <div class="col-sub">Sub Department</div>
    <div class="col-head">Project Head</div>
    <div class="col-brand">Brand</div>
    <div class="col-start">Date Started</div>
    <div class="col-deadline">Deadline</div>
    <div class="col-remarks">Remarks</div>
    <div class="col-accomplishment">Accomplishment</div>
    <div class="col-status">Status</div>
  </div>

  <div class="content" id="data-rows"></div>

  <footer>
    <div class="footer-top">
      <div class="custom-box" id="pageSpace" style="display:flex;"></div>
    </div>

    <div class="footer-bottom">
      <div class="headline-box">
        <div class="headline-text" id="headline-text"></div>
      </div>
    </div>

    <div class="name-time-box">
      <div id="week-text"></div>
      <div id="date-text"></div>
      <div id="year-text"></div>
      <div id="time-text"></div>
    </div>

    <img src="logo.png" alt="Logo" class="footer-logo">
  </footer>

  <audio id="bg-music" src="startup.mp3" autoplay loop preload="auto"></audio>

  <script>
    // your JS is still intact below (not reformatted deeply to avoid breaking anything)
  </script>

</body>
</html>
